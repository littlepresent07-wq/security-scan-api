# fly.toml app configuration file generated for security-scan-api on 2026-11-14T09:23:50Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'security-scan-api'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 3000
  force_https = true

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 30

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
